<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LabKit — Your Blood Test, In Plain Words</title>
<meta name="description" content="LabKit turns a confusing blood-test report into plain words: what each number means, what is low or high, what to ask your doctor — all on your device.">
<meta name="theme-color" content="#2b2118">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232b2118'/%3E%3Cpath d='M20 44h24M20 32h24M20 20h24' stroke='%23d9a441' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#faf5ec; --paper2:#f3ead9; --card:#fffdf7; --ink:#2b2118; --ink2:#5d4c3a;
  --mut:#8a7661; --line:#e5d8c2; --bronze:#b07d3c; --amber:#d9a441; --gold:#e8b64c;
  --terra:#c05b2e; --terra-d:#9c4520; --green:#4a7a4f; --greenbg:#e9f1e4;
  --red:#a83a22; --redbg:#fbe9e2; --watch:#9a6a14; --watchbg:#fdf3d7;
  --okbg:#eef4ea; --r:18px; --sh:0 10px 30px rgba(43,33,24,.10);
  --sh2:0 22px 55px rgba(43,33,24,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.01em}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
a{color:var(--terra)}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px;border-radius:6px}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.muted{color:var(--mut)}
.small{font-size:13px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--bronze)}
/* ---------- cinematic intro ---------- */
#intro{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#241a10 0%,#3a2a18 55%,#6b4423 100%);color:#f7ead2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;cursor:pointer;overflow:hidden}
#intro .rays{position:absolute;inset:-40%;background:conic-gradient(from 0deg,transparent 0 18deg,rgba(232,182,76,.10) 18deg 26deg,transparent 26deg 60deg,rgba(232,182,76,.07) 60deg 68deg,transparent 68deg 360deg);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#intro .mark{width:92px;height:92px;border-radius:24px;background:#f7ead2;display:grid;place-items:center;box-shadow:0 0 0 1px rgba(232,182,76,.5),0 18px 50px rgba(0,0,0,.45);animation:markIn .9s cubic-bezier(.2,.9,.25,1.2) both}
@keyframes markIn{from{transform:scale(.4) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#intro h1{font-size:clamp(44px,9vw,76px);line-height:1;margin-top:26px;animation:rise .8s .35s cubic-bezier(.2,.8,.2,1) both}
#intro h1 span{color:var(--gold)}
#intro .tag{margin-top:12px;font-size:clamp(15px,2.6vw,19px);color:#e6cfa4;animation:rise .8s .55s cubic-bezier(.2,.8,.2,1) both}
#intro .bar{width:min(280px,70vw);height:4px;border-radius:99px;background:rgba(247,234,210,.25);margin-top:34px;overflow:hidden;animation:rise .8s .7s both}
#intro .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--terra));border-radius:99px;animation:fill 3.4s .7s ease forwards}
@keyframes fill{to{width:100%}}
#intro .skip{position:absolute;bottom:26px;right:26px;background:rgba(247,234,210,.14);border:1px solid rgba(247,234,210,.4);color:#f7ead2;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700}
@keyframes rise{from{transform:translateY(18px);opacity:0}to{transform:translateY(0);opacity:1}}
#intro.gone{display:none}
/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:60;background:rgba(250,245,236,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding:13px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .lg{width:40px;height:40px;border-radius:12px;background:var(--ink);display:grid;place-items:center;flex:none}
.logo b{font-family:Fraunces,serif;font-size:22px;letter-spacing:-.01em}
.logo small{display:block;font-size:10px;letter-spacing:.18em;color:var(--bronze);font-weight:800;text-transform:uppercase;margin-top:-3px}
.top nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.top nav a{color:var(--ink2);text-decoration:none;font-size:13.5px;font-weight:600;padding:8px 11px;border-radius:99px}
.top nav a:hover{background:var(--paper2);color:var(--ink)}
/* ---------- hero ---------- */
.hero{position:relative;border-radius:0 0 28px 28px;overflow:hidden;background:#3a2a18}
.hero img.ph{width:100%;height:min(58vw,430px);object-fit:cover;object-position:center 38%;animation:kb 26s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateY(0)}to{transform:scale(1.08) translateY(-8px)}}
.hero .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(28,19,10,.18) 0%,rgba(28,19,10,0) 42%,rgba(28,19,10,.72) 100%)}
.hero .copy{position:absolute;left:0;right:0;bottom:0;padding:26px 22px 30px;color:#fdf6e7}
.hero .copy h1{font-size:clamp(34px,6.4vw,58px);line-height:1.04;max-width:640px}
.hero .copy h1 em{color:var(--gold);font-style:normal}
.hero .copy p{margin-top:10px;max-width:560px;color:#f2e3c8;font-size:clamp(14.5px,2.4vw,17px)}
.hero .disc{margin-top:12px;font-size:12.5px;color:#e8d5ae;opacity:.92}
/* ---------- report card overlapping hero ---------- */
.rep-card{position:relative;z-index:2;margin-top:-64px;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--sh2);padding:22px 22px 18px}
.rep-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.rep-top .ic{width:52px;height:52px;flex:none;border-radius:16px;background:var(--paper2);display:grid;place-items:center;color:var(--bronze)}
.rep-top h2{font-size:clamp(21px,3.4vw,27px);line-height:1.15}
.rep-top .sub{color:var(--mut);font-size:13.5px;margin-top:3px}
.flag-pill{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;font-size:12.5px;font-weight:800;letter-spacing:.02em}
.pill.warn{background:var(--watchbg);color:var(--watch)}
.pill.ok{background:var(--okbg);color:var(--green)}
.pill.bad{background:var(--redbg);color:var(--red)}
.rep-vals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.rv{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;width:100%}
.rv:hover{border-color:var(--bronze)}
.rv .nm{font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
.rv .vl{font-family:Fraunces,serif;font-size:21px;font-weight:700;margin-top:2px}
.rv .vl small{font-size:12px;font-family:Inter,sans-serif;font-weight:600;color:var(--mut)}
.rv .vd{font-size:11.5px;font-weight:800;margin-top:1px}
.vd.low{color:var(--red)} .vd.high{color:var(--red)} .vd.watch{color:var(--watch)} .vd.ok{color:var(--green)}
.rep-foot{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fdf6e7;font-weight:700;font-size:14px;padding:11px 18px;border-radius:99px;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:#3d2d1d}
.btn.ghost{background:transparent;color:var(--ink);border-color:#cbb894}
.btn.ghost:hover{background:var(--paper2)}
.btn.terra{background:var(--terra);border-color:var(--terra)}
.btn.terra:hover{background:var(--terra-d)}
/* ---------- stats strip ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.stat b{font-family:Fraunces,serif;font-size:30px;display:block;line-height:1.05}
.stat span{font-size:13px;color:var(--mut);font-weight:600}
.stat.warn b{color:var(--terra)} .stat.good b{color:var(--green)}

/* ---------- sections ---------- */
section.block{margin-top:44px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.sec-head h2{font-size:clamp(24px,4vw,32px)}
.sec-head .count{margin-left:auto;font-size:13px;font-weight:700;color:var(--mut)}
.sec-sub{color:var(--mut);font-size:14.5px;max-width:640px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
/* ---------- decoder (dark panel) ---------- */
.dec{background:linear-gradient(150deg,#2b2118,#4a3018 70%,#6b4423);border-radius:24px;color:#f7ead2;padding:26px 24px;box-shadow:var(--sh2);overflow:hidden;position:relative}
.dec::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(232,182,76,.28),transparent 70%)}
.dec h2{color:#fdf6e7;font-size:clamp(24px,4vw,32px)}
.dec p.sub{color:#e6cfa4;margin-top:6px;max-width:600px}
.dec .sexrow{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(247,234,210,.14);border:1px solid rgba(247,234,210,.3);border-radius:99px;padding:4px}
.seg button{border:0;background:transparent;color:#f2e3c8;font-weight:700;font-size:13.5px;padding:7px 16px;border-radius:99px}
.seg button.on{background:var(--gold);color:#2b2118}
.dec-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;margin-top:18px;position:relative;z-index:1}
.testlist{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:300px;overflow:auto;padding-right:4px}
.tchip{border:1px solid rgba(247,234,210,.28);background:rgba(247,234,210,.07);color:#f7ead2;border-radius:12px;padding:10px 12px;text-align:left}
.tchip:hover{border-color:var(--gold)}
.tchip.on{background:var(--gold);color:#2b2118;border-color:var(--gold)}
.tchip b{display:block;font-size:14px}
.tchip span{font-size:11.5px;opacity:.85}
.dec-form{background:rgba(250,245,236,.07);border:1px solid rgba(247,234,210,.25);border-radius:16px;padding:18px}
.dec-form label{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e6cfa4;display:block;margin-bottom:6px}
.dec-form .valrow{display:flex;gap:10px}
.dec-form input{flex:1;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:700;min-width:0}
.dec-form .unit{align-self:center;color:#e6cfa4;font-weight:700;font-size:13px;white-space:nowrap}
.verdict{margin-top:14px;border-radius:14px;padding:14px 16px;display:none}
.verdict.show{display:block}
.verdict.ok{background:#eef4ea;color:#2f5233}
.verdict.watch{background:#fdf3d7;color:#6d4a0c}
.verdict.low,.verdict.high{background:#fbe9e2;color:#7c2a15}
.verdict b{font-size:17px;display:block}
.verdict p{font-size:14px;margin-top:4px}
.verdict .ask{margin-top:8px;font-size:13.5px;border-top:1px solid rgba(0,0,0,.12);padding-top:8px}
.rangebar{height:10px;border-radius:99px;background:linear-gradient(90deg,#c05b2e 0 12%,#d9a441 12% 22%,#4a7a4f 22% 78%,#d9a441 78% 88%,#c05b2e 88% 100%);margin:12px 0 4px;position:relative}
.rangebar i{position:absolute;top:-4px;width:4px;height:18px;background:#2b2118;border-radius:2px;transform:translateX(-50%)}
.rangelab{display:flex;justify-content:space-between;font-size:11.5px;color:#e6cfa4}
/* ---------- reports rail ---------- */
.rail{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory}
.rail::-webkit-scrollbar{height:8px}
.rail::-webkit-scrollbar-thumb{background:#d8c8ab;border-radius:99px}
.rep-mini{flex:0 0 300px;scroll-snap-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);cursor:pointer;text-align:left}
.rep-mini:hover{border-color:var(--bronze)}
.rep-mini h3{font-size:18px}
.rep-mini .meta{font-size:13px;color:var(--mut);margin-top:2px}
.mini-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fchip{font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--paper2);color:var(--ink2)}
.fchip.bad{background:var(--redbg);color:var(--red)}
.fchip.watch{background:var(--watchbg);color:var(--watch)}
/* ---------- trend ---------- */
.trend-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:stretch}
.trend-card{padding:20px}
.trend-card canvas{width:100%;height:220px;display:block}
.test-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tp{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink2)}
.tp.on{background:var(--ink);color:#fdf6e7;border-color:var(--ink)}
.trend-note{font-size:14px;color:var(--ink2);margin-top:10px}
.trend-note b{color:var(--ink)}
/* ---------- prep + questions split ---------- */
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.prep{padding:20px}
.prep .ringwrap{display:flex;gap:16px;align-items:center;margin:14px 0 6px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .rv2{position:absolute;inset:0;display:grid;place-items:center;font-family:Fraunces,serif;font-weight:700;font-size:21px}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:11px 2px;border-top:1px solid var(--line);cursor:pointer}
.checkrow:first-of-type{border-top:0}
.checkrow input{accent-color:var(--terra);width:19px;height:19px;margin-top:2px;flex:none}
.checkrow b{font-size:14.5px;display:block}
.checkrow span{font-size:13px;color:var(--mut)}
.next-test{margin-top:12px;background:var(--paper);border:1px dashed #cbb894;border-radius:14px;padding:13px 15px;font-size:14px}
.next-test b{font-family:Fraunces,serif;font-size:18px}
.qcard{padding:20px}
.qlist{list-style:none;margin-top:8px}
